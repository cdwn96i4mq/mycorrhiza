[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mycorrhiza"
version = "0.1.0"
description = "Token-level cross-modal masked pretraining of dissociated scRNA-seq and tumour spatial transcriptomics, with tissue-resolved immune-evasion program discovery."
requires-python = "==3.8.*"
license = { text = "MIT" }
dependencies = [
    "torch==1.13.1",
    "numpy==1.23.5",
    "scipy==1.9.3",
    "scikit-learn==1.1.3",
    "pandas==1.5.3",
    "python-igraph==0.10.4",
    "leidenalg==0.9.1",
    "gin-config==0.5.0",
    "plac==1.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest==7.2.2",
    "ruff==0.0.292",
    "black==23.3.0",
    "isort==5.12.0",
    "mypy==1.4.1",
]

[project.scripts]
forager = "mycorrhiza.forager:main"

[tool.setuptools.packages.find]
include = ["mycorrhiza*"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "W", "B"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
strict = true
disallow_untyped_decorators = false
disallow_subclassing_any = false
warn_return_any = false
ignore_missing_imports = true
disable_error_code = ["no-untyped-call", "no-any-return"]

[[tool.mypy.overrides]]
module = ["gin", "plac", "leidenalg", "igraph", "sklearn.*", "scipy.*"]
ignore_missing_imports = true
